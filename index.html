<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pastely" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Pastely</title>
  </head>
  <body>
    <div id="a2hs" class="a2hs" hidden>
      <p>Share, then Add to Home Screen.</p>
      <button type="button" id="a2hs-dismiss">OK</button>
    </div>

    <main>
      <section id="camera" class="screen">
        <h1>Pastely</h1>
        <p>Take a picture of a sticker</p>
        <button type="button" id="take-photo" class="shutter">
          Take a picture of a sticker
        </button>
        <button type="button" id="choose-photos" class="secondary">
          Choose from photos
        </button>
        <p id="camera-error" class="error" hidden></p>
      </section>

      <section id="library" class="screen" hidden>
        <h1>Library</h1>
        <p id="library-empty">Take a picture of a sticker</p>
        <div id="library-grid" class="grid"></div>
      </section>
    </main>

    <nav class="tabs">
      <button type="button" data-screen="camera" class="tab is-active">
        Take photo
      </button>
      <button type="button" data-screen="library" class="tab">Library</button>
    </nav>

    <div id="processing" class="overlay" hidden>
      <p id="processing-copy">Cutting out sticker...</p>
    </div>

    <div id="preview" class="overlay preview" hidden>
      <div class="preview-stage">
        <img id="preview-img" alt="Cut out sticker" />
      </div>
      <p id="preview-error" class="error" hidden></p>
      <div class="preview-actions">
        <button type="button" id="keep">Keep</button>
        <button type="button" id="retake" class="secondary">Retake</button>
      </div>
    </div>

    <input
      id="input-camera"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
    <input id="input-gallery" type="file" accept="image/*" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
